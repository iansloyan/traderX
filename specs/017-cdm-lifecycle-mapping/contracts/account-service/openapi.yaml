openapi: 3.0.1
info:
  title: "Account Service - TraderX Spec-First"
  version: "1.0"
paths:
  /account/:
    get:
      operationId: listAccounts
      summary: List all accounts
      responses:
        "200":
          description: OK
        "503":
          description: cdm-service (authoritative for accounts in state 017) is down or not ready
    post:
      operationId: createAccount
      summary: Create account
      responses:
        "200":
          description: OK
        "400":
          description: Invalid input rejected by cdm-service (state 017), e.g. displayName over 50 or username over 15 characters
        "503":
          description: cdm-service (authoritative for accounts in state 017) is down or not ready
    put:
      operationId: updateAccount
      summary: Update account
      responses:
        "200":
          description: OK
        "400":
          description: Invalid input rejected by cdm-service (state 017), e.g. displayName over 50 or username over 15 characters
        "503":
          description: cdm-service (authoritative for accounts in state 017) is down or not ready
  /account/{id}:
    get:
      operationId: getAccountById
      summary: Get account by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
        "503":
          description: cdm-service (authoritative for accounts in state 017) is down or not ready
        "404":
          description: Not found
  /accountuser/:
    get:
      operationId: listAccountUsers
      summary: List all account-user mappings
      responses:
        "200":
          description: OK
        "503":
          description: cdm-service (authoritative for accounts in state 017) is down or not ready
    post:
      operationId: createAccountUser
      summary: Add account-user mapping
      responses:
        "200":
          description: OK
        "400":
          description: Invalid input rejected by cdm-service (state 017), e.g. displayName over 50 or username over 15 characters
        "503":
          description: cdm-service (authoritative for accounts in state 017) is down or not ready
        "404":
          description: Person not found
    put:
      operationId: updateAccountUser
      summary: Update account-user mapping
      responses:
        "200":
          description: OK
        "400":
          description: Invalid input rejected by cdm-service (state 017), e.g. displayName over 50 or username over 15 characters
        "503":
          description: cdm-service (authoritative for accounts in state 017) is down or not ready
  /accountuser/{id}:
    get:
      operationId: getAccountUsersByAccountId
      summary: Get account-user mappings by account id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
        "503":
          description: cdm-service (authoritative for accounts in state 017) is down or not ready
        "404":
          description: Not found
components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: integer
        displayName:
          type: string
        cdmRef:
          type: string
          description: Optional (state 017). Reference of the CDM Party, e.g. cdm:party:22214.
    AccountUser:
      type: object
      properties:
        accountId:
          type: integer
        username:
          type: string
        cdmRef:
          type: string
          description: Optional (state 017). Reference of the CDM person, e.g. cdm:person:user01.
